name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            bundles: nsis
            directory: target/release/bundle/nsis
            path: target/release/bundle/nsis/*.exe
            stable_name: Shehata-Git-windows-x64-setup.exe
          - os: macos-latest
            label: macOS disk image
            bundles: dmg
            directory: target/release/bundle/dmg
            path: target/release/bundle/dmg/*.dmg
            stable_name: Shehata-Git-macos-apple-silicon.dmg

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-03
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 as of 2026-08-03

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 as of 2026-08-03
        with:
          node-version: 20
          cache: pnpm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of 2026-08-03

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Refuse to publish an installer whose file name and contents would
      # describe different releases.
      - name: Version matches the tag
        run: node scripts/check-versions.mjs "${{ github.ref_name }}"

      - name: Prepare Tauri sidecars
        run: pnpm prepare:sidecars

      - name: Frontend production build
        run: pnpm --filter @shehata/desktop build

      # Unsigned on both platforms for now. Windows SmartScreen and macOS
      # Gatekeeper each show a one-time warning users can bypass.
      - name: Build installer
        run: pnpm --filter @shehata/desktop tauri build --bundles ${{ matrix.bundles }}

      # Documentation links to a name that never changes, so the download
      # buttons keep working after every version bump.
      - name: Add version-independent installer name
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.directory }}"
          built=""
          for candidate in *.exe *.dmg; do
            [ -e "$candidate" ] || continue
            built="$candidate"
            break
          done
          [ -n "$built" ] || { echo "no installer was produced"; exit 1; }
          cp "$built" "${{ matrix.stable_name }}"

      - name: Checksum the installers
        shell: bash
        run: |
          set -euo pipefail
          # Use the directory directly: `dirname` on a glob that matches more
          # than one file prints one line per match and breaks `cd`.
          cd "${{ matrix.directory }}"
          # macOS runners ship `shasum`, Windows/Linux ship `sha256sum`.
          if command -v sha256sum >/dev/null; then
            checksum() { sha256sum "$1"; }
          else
            checksum() { shasum -a 256 "$1"; }
          fi
          for file in *.exe *.dmg; do
            [ -e "$file" ] || continue
            checksum "$file" > "$file.sha256"
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 as of 2026-08-03
        with:
          name: installer-${{ matrix.os }}
          path: |
            ${{ matrix.path }}
            ${{ matrix.path }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4 as of 2026-08-03
        with:
          path: installers
          merge-multiple: true

      - name: Create release with installers
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 as of 2026-08-03
        with:
          files: installers/**
          generate_release_notes: true

      # Package manifests repeat the version and the checksum, so they are
      # regenerated from what was just published rather than edited by hand.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-03
        with:
          path: source

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 as of 2026-08-03
        with:
          node-version: 20

      - name: Refresh package manifests
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          windows=$(awk '{print $1}' "../installers/Shehata.Git_${version}_x64-setup.exe.sha256")
          macos=$(awk '{print $1}' "../installers/Shehata.Git_${version}_aarch64.dmg.sha256")
          node scripts/make-packages.mjs "$version" "$windows" "$macos"

          if git diff --quiet; then
            echo "manifests already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket packaging
          git commit -m "chore(packaging): manifests for ${version}"
          # The tag was cut before this commit, so push to the branch it is on.
          git push origin HEAD:main
