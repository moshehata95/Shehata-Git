name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-03
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 as of 2026-08-03

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 as of 2026-08-03
        with:
          node-version: 20
          cache: pnpm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of 2026-08-03
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Cheap and first: a version drift here makes every later artifact
      # describe a build that does not exist.
      - name: Version consistency
        run: node scripts/check-versions.mjs

      # Tauri validates every configured external binary while compiling the
      # desktop crate. Build the real sidecars in a clean checkout first.
      - name: Prepare Tauri sidecars
        run: pnpm prepare:sidecars

      # Tauri embeds frontendDist while compiling the desktop crate, so build
      # the web assets before the Rust workspace in a clean checkout.
      - name: Frontend lint
        run: pnpm --filter @shehata/desktop lint

      - name: Frontend type check
        run: pnpm --filter @shehata/desktop typecheck

      - name: Frontend tests
        run: pnpm --filter @shehata/desktop test

      - name: Frontend production build
        run: pnpm --filter @shehata/desktop build

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  macos:
    name: macOS build
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-03
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 as of 2026-08-03

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 as of 2026-08-03
        with:
          node-version: 20
          cache: pnpm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of 2026-08-03

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri sidecars
        run: pnpm prepare:sidecars

      - name: Frontend production build
        run: pnpm --filter @shehata/desktop build

      - name: Rust tests
        run: cargo test --workspace

      # Unsigned for now: distribution signing needs an Apple Developer
      # certificate. Users open the app once via right-click > Open.
      - name: Build macOS app bundle
        run: pnpm --filter @shehata/desktop tauri build --bundles dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 as of 2026-08-03
        with:
          name: shehata-git-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  security:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-03
        with:
          persist-credentials: false
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 as of 2026-08-03

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 as of 2026-08-03
        with:
          node-version: 20
          cache: pnpm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of 2026-08-03

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-versions.mjs

      - name: Install audit tooling
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2 as of 2026-08-03
        with:
          tool: cargo-deny,cargo-audit

      # Advisories and licences. `cargo deny` reads deny.toml.
      - name: Rust dependency policy
        run: cargo deny check

      - name: Rust advisories
        run: cargo audit

      # Production dependencies only: a dev-tool advisory should not block a
      # release of software that never ships it.
      - name: Frontend advisories
        run: pnpm audit --prod

      - name: Workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2 as of 2026-08-03

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 as of 2026-08-03
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
