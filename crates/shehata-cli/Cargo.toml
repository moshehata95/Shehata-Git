[package]
name = "shehata-cli"
description = "shehata — command-line interface for Shehata Git"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shehata"
path = "src/main.rs"

[dependencies]
shehata-core = { path = "../shehata-core" }
shehata-git = { path = "../shehata-git" }
shehata-github = { path = "../shehata-github" }
shehata-storage = { path = "../shehata-storage" }

clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which = "8"

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

[dev-dependencies]
tempfile.workspace = true
